[project]
name = "sandbox-runners"
version = "0.1.0"
description = "Run GitHub Actions jobs in Render sandboxes, one sandbox per job"
readme = "README.md"
authors = [
    { name = "Patrick Veverka", email = "296341601+patrickatrender@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15.1",
    "render>=1.9.0",
    "starlette>=1.10.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
